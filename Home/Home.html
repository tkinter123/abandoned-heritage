<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Space Journey</title>


    <style>

        /* ========================================
           RESET
        ======================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ========================================
           PAGE
        ======================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            position: relative;

            background-image:
                url("Background5.jpeg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            font-family:
                "Times New Roman",
                Times,
                serif;

        }


        /* ========================================
           DARK SPACE OVERLAY
        ======================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 0%,
                    rgba(0,0,20,0.05) 35%,
                    rgba(0,0,30,0.55) 100%
                );

            pointer-events: none;

            z-index: 1;

        }


        /* ========================================
           BUTTONS
        ======================================== */

        .button1,
        .button2,
        .button3 {

            position: absolute;

            width: 90px;

            height: 32px;

            color: white;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 14px;

            background:
                linear-gradient(
                    135deg,
                    #40106d,
                    #8a2be2
                );

            border:
                2px solid
                rgba(210,170,255,0.9);

            border-radius: 20px;

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 0 8px #8a2be2,
                0 0 20px #6a1bb1;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .button1 {
            top: 465px;
            left: 645px;
        }


        .button2 {
            top: 469px;
            left: 275px;
        }


        .button3 {
            top: 469px;
            left: 1020px;
        }


        /* ========================================
           BUTTON HOVER
        ======================================== */

        .button1:hover,
        .button2:hover,
        .button3:hover {

            transform: scale(1.15);

            box-shadow:
                0 0 12px white,
                0 0 25px #b65cff,
                0 0 50px #8a2be2;

        }


        /* ========================================
           SPACE TRAVEL CANVAS
        ======================================== */

        #spaceTravel {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1000;

            pointer-events: none;

            opacity: 0;

        }


        /* ========================================
           ENERGY GLOW
        ======================================== */

        .energy {

            position: fixed;

            left: 50%;
            top: 50%;

            width: 10px;
            height: 10px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            z-index: 1001;

            pointer-events: none;

            opacity: 0;

            background:
                white;

            box-shadow:

                0 0 10px white,

                0 0 30px #b86cff,

                0 0 70px #8a2be2,

                0 0 130px #4b0082;

        }


        /* ========================================
           OUTER SPACE VIGNETTE
        ======================================== */

        .space-vignette {

            position: fixed;

            inset: 0;

            z-index: 1002;

            pointer-events: none;

            opacity: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0,0,30,0.15) 50%,
                    rgba(0,0,0,0.8) 100%
                );

        }


        /* ========================================
           FINAL WHITE FLASH
        ======================================== */

        .flash {

            position: fixed;

            inset: 0;

            background: white;

            z-index: 1003;

            pointer-events: none;

            opacity: 0;

        }


        /* ========================================
           TRAVEL MODE
        ======================================== */

        body.travelling #spaceTravel {

            opacity: 1;

        }


        body.travelling .energy {

            animation:
                energyPulse
                5.5s
                ease-in-out
                forwards;

        }


        body.travelling .space-vignette {

            animation:
                vignetteTravel
                5.5s
                ease-in-out
                forwards;

        }


        body.travelling .flash {

            animation:
                finalFlash
                5.5s
                ease-in
                forwards;

        }


        /* ========================================
           ENERGY PULSE
        ======================================== */

        @keyframes energyPulse {

            0% {

                opacity: 0;

                width: 10px;
                height: 10px;

                box-shadow:
                    0 0 10px white,
                    0 0 30px #b86cff,
                    0 0 70px #8a2be2;

            }

            15% {

                opacity: 0.4;

                width: 40px;
                height: 40px;

            }

            35% {

                opacity: 0.7;

                width: 100px;
                height: 100px;

                box-shadow:
                    0 0 20px white,
                    0 0 70px #b86cff,
                    0 0 150px #8a2be2;

            }

            55% {

                opacity: 0.85;

                width: 250px;
                height: 250px;

            }

            75% {

                opacity: 1;

                width: 600px;
                height: 600px;

            }

            90% {

                opacity: 1;

                width: 1400px;
                height: 1400px;

            }

            100% {

                opacity: 1;

                width: 3000px;
                height: 3000px;

                background: white;

                box-shadow: none;

            }

        }


        /* ========================================
           VIGNETTE
        ======================================== */

        @keyframes vignetteTravel {

            0% {
                opacity: 0;
            }

            25% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.3;
            }

            75% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                opacity: 1;
            }

        }


        /* ========================================
           FINAL FLASH
        ======================================== */

        @keyframes finalFlash {

            0% {
                opacity: 0;
            }

            75% {
                opacity: 0;
            }

            88% {
                opacity: 0.15;
            }

            94% {
                opacity: 0.7;
            }

            97% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }

        }


        /* ========================================
           HIDE PAGE DURING TRAVEL
        ======================================== */

        body.travelling > *:not(#spaceTravel):not(.energy):not(.space-vignette):not(.flash) {

            animation:
                pageBlur
                5.5s
                ease-in
                forwards;

        }


        @keyframes pageBlur {

            0% {

                transform: scale(1);

                filter: blur(0);

                opacity: 1;

            }

            30% {

                transform: scale(1.02);

                filter: blur(0);

                opacity: 1;

            }

            55% {

                transform: scale(1.08);

                filter: blur(1px);

                opacity: 0.8;

            }

            75% {

                transform: scale(1.2);

                filter: blur(4px);

                opacity: 0.5;

            }

            90% {

                transform: scale(1.5);

                filter: blur(10px);

                opacity: 0.15;

            }

            100% {

                transform: scale(2);

                filter: blur(20px);

                opacity: 0;

            }

        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .button1 {

                top: 40%;
                left: 20%;

            }

            .button2 {

                top: 50%;
                left: 20%;

            }

            .button3 {

                top: 60%;
                left: 20%;

            }

        }

    </style>

</head>


<body>


    <!-- ======================================
         DESTINATION BUTTONS
    ======================================= -->

    <button
        class="button1"
        onclick="
            travelTo(
                '../Deep Space/Deep Space.html',
                this
            )
        "
    >
        DEEP SPACE
    </button>


    <button
        class="button2"
        onclick="
            travelTo(
                '../Mars/Mars.html',
                this
            )
        "
    >
        MARS
    </button>


    <button
        class="button3"
        onclick="
            travelTo(
                '../Moon/Moon.html',
                this
            )
        "
    >
        MOON
    </button>


    <!-- ======================================
         SPACE TRAVEL CANVAS
    ======================================= -->

    <canvas id="spaceTravel"></canvas>


    <!-- ======================================
         EFFECT LAYERS
    ======================================= -->

    <div class="energy"></div>

    <div class="space-vignette"></div>

    <div class="flash"></div>


    <script>

        /* ========================================
           CANVAS
        ======================================== */

        const canvas =
            document.getElementById(
                "spaceTravel"
            );

        const ctx =
            canvas.getContext("2d");


        /* ========================================
           CANVAS SIZE
        ======================================== */

        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* ========================================
           STAR SYSTEM
        ======================================== */

        const stars = [];


        const STAR_COUNT = 700;


        /* ========================================
           CREATE STAR
        ======================================== */

        function createStar() {

            return {

                x:
                    (Math.random() - 0.5)
                    * canvas.width,

                y:
                    (Math.random() - 0.5)
                    * canvas.height,

                z:
                    Math.random()
                    * canvas.width,

                pz: 0

            };

        }


        /* ========================================
           INITIALIZE STARS
        ======================================== */

        function initializeStars() {

            stars.length = 0;

            for (
                let i = 0;
                i < STAR_COUNT;
                i++
            ) {

                const star =
                    createStar();

                star.pz =
                    star.z;

                stars.push(star);

            }

        }


        initializeStars();


        /* ========================================
           TRAVEL STATE
        ======================================== */

        let travelling = false;

        let startTime = 0;

        const TRAVEL_DURATION =
            5500;


        /* ========================================
           DRAW STAR FIELD
        ======================================== */

        function drawStars(progress) {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            const centerX =
                canvas.width / 2;

            const centerY =
                canvas.height / 2;


            /*
             * Acceleration curve.
             */

            let speed;

            if (progress < 0.2) {

                speed =
                    2 +
                    progress * 15;

            }

            else if (progress < 0.5) {

                speed =
                    5 +
                    progress * 45;

            }

            else if (progress < 0.75) {

                speed =
                    30 +
                    progress * 120;

            }

            else {

                speed =
                    120 +
                    progress * 300;

            }


            /*
             * Draw every star.
             */

            for (const star of stars) {

                star.pz =
                    star.z;

                star.z -= speed;


                /*
                 * Recycle stars after
                 * they pass the camera.
                 */

                if (star.z < 1) {

                    star.x =
                        (Math.random() - 0.5)
                        * canvas.width;

                    star.y =
                        (Math.random() - 0.5)
                        * canvas.height;

                    star.z =
                        canvas.width;

                    star.pz =
                        star.z;

                }


                /*
                 * Perspective projection.
                 */

                const sx =
                    centerX +
                    star.x /
                    star.z *
                    canvas.width;

                const sy =
                    centerY +
                    star.y /
                    star.z *
                    canvas.width;


                const px =
                    centerX +
                    star.x /
                    star.pz *
                    canvas.width;

                const py =
                    centerY +
                    star.y /
                    star.pz *
                    canvas.width;


                /*
                 * Star size.
                 */

                const size =
                    Math.max(
                        0.5,
                        (1 -
                            star.z /
                            canvas.width
                        ) * 4
                    );


                /*
                 * Star brightness.
                 */

                const alpha =
                    Math.min(
                        1,
                        1 -
                        star.z /
                        canvas.width
                    );


                /*
                 * Draw streak.
                 */

                ctx.beginPath();

                ctx.moveTo(
                    px,
                    py
                );

                ctx.lineTo(
                    sx,
                    sy
                );


                ctx.strokeStyle =
                    `rgba(
                        210,
                        190,
                        255,
                        ${alpha}
                    )`;


                ctx.lineWidth =
                    size;


                ctx.stroke();


                /*
                 * Bright star core.
                 */

                ctx.beginPath();

                ctx.arc(
                    sx,
                    sy,
                    size * 0.7,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(
                        255,
                        255,
                        255,
                        ${alpha}
                    )`;


                ctx.fill();

            }

        }


        /* ========================================
           ANIMATION LOOP
        ======================================== */

        function animateTravel(timestamp) {

            if (!travelling) {
                return;
            }


            const elapsed =
                timestamp - startTime;


            const progress =
                Math.min(
                    elapsed /
                    TRAVEL_DURATION,
                    1
                );


            drawStars(progress);


            if (progress < 1) {

                requestAnimationFrame(
                    animateTravel
                );

            }

        }


        /* ========================================
           START TRAVEL
        ======================================== */

        function startHyperspace() {

            travelling = true;

            startTime =
                performance.now();

            initializeStars();


            requestAnimationFrame(
                animateTravel
            );

        }


        /* ========================================
           TRAVEL FUNCTION
        ======================================== */

        function travelTo(page, button) {

            /*
             * Prevent multiple clicks.
             */

            if (
                document.body.classList.contains(
                    "travelling"
                )
            ) {

                return;

            }


            /*
             * Start the visual effect.
             */

            document.body.classList.add(
                "travelling"
            );


            /*
             * Disable buttons.
             */

            document.querySelectorAll(
                "button"
            ).forEach(
                button => {

                    button.disabled =
                        true;

                }
            );


            /*
             * Start actual star travel.
             */

            startHyperspace();


            /*
             * Open destination after
             * 5.5 seconds.
             */

            setTimeout(
                () => {

                    window.location.href =
                        page;

                },
                TRAVEL_DURATION
            );

        }

    </script>

</body>

</html>
