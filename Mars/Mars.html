<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mars Exhibition</title>

</head>


<body>


    <!-- ========================================
         UNDER CONSTRUCTION MESSAGE
    ========================================= -->

    <p class="message1">

        <b>

            <marquee>

                <h1>
                    Ee vaai, data de fast...!!!
                </h1>

            </marquee>

        </b>

    </p>



    <!-- ========================================
         HOME BUTTON
    ========================================= -->

    <button
        class="home_button"
        onclick="goHome()">

        Home Page

    </button>



    <!-- ========================================
         PAGE TRANSITION
    ========================================= -->

    <div class="page_transition"></div>



    <style>


        /* ========================================
           RESET
        ======================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        /* ========================================
           PAGE
        ======================================== */

        html,
        body {

            height: 100%;

            width: 100%;

            overflow: hidden;

        }



        /* ========================================
           BODY
        ======================================== */

        body {

            background-color: #151515;

            background-size: cover;

            background-repeat: no-repeat;

        }



        /* ========================================
           HOME BUTTON
        ======================================== */

        .home_button {

            position: absolute;

            height: 35px;

            width: 80px;

            top: 90%;

            left: 5%;

            background-color: whitesmoke;

            color: black;

            filter:
                drop-shadow(0 0 20px cyan);

            border:
                2px solid whitesmoke;

            border-radius: 20%;

            cursor: pointer;

            z-index: 10;

            transition:
                transform 0.3s ease,
                filter 0.3s ease;

        }



        /* ========================================
           BUTTON HOVER
        ======================================== */

        .home_button:hover {

            transform: scale(1.15);

            filter:
                drop-shadow(0 0 18px cyan);

        }



        /* ========================================
           MESSAGE
        ======================================== */

        .message1 {

            position: absolute;

            top: 50%;

            left: 0;

            width: 100vw;

            color: aqua;

            font-family:
                Georgia,
                'Times New Roman',
                Times,
                serif;

        }



        /* ========================================
           PAGE TRANSITION
        ======================================== */

        .page_transition {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:

                radial-gradient(
                    circle at center,

                    white 0%,

                    white 3%,

                    cyan 8%,

                    #00aaff 15%,

                    #1515ff 30%,

                    #4b0082 55%,

                    #151515 100%
                );

            opacity: 0;

            transform: scale(0);

            transform-origin: center;

            pointer-events: none;

            z-index: 9999;

        }



        /* ========================================
           START TRANSITION
        ======================================== */

        body.leaving .page_transition {

            animation:

                pageWarp
                1s
                ease-in
                forwards;

        }



        /* ========================================
           PAGE WARP ANIMATION
        ======================================== */

        @keyframes pageWarp {


            /* START */

            0% {

                opacity: 0;

                transform: scale(0);

            }



            /* LIGHT APPEARS */

            30% {

                opacity: 0.2;

                transform: scale(0.3);

            }



            /* EXPAND */

            50% {

                opacity: 0.5;

                transform: scale(1);

            }



            /* COVER SCREEN */

            70% {

                opacity: 0.8;

                transform: scale(3);

            }



            /* FLASH */

            90% {

                opacity: 1;

                transform: scale(10);

                background: white;

            }



            /* COMPLETE */

            100% {

                opacity: 1;

                transform: scale(20);

                background: white;

            }

        }



    </style>



    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        function goHome() {


            /*
             * Add the "leaving" class.
             *
             * This activates the CSS
             * page transition animation.
             */

            document.body.classList.add("leaving");



            /*
             * Wait for the animation
             * to finish.
             *
             * 1000 milliseconds = 1 second.
             */

            setTimeout(function () {


                /*
                 * Navigate to Home page.
                 */

                window.location.href =
                    "../Home/Home.html";


            }, 1000);


        }


    </script>


</body>

</html>
